name: Playwright E2E

on:
  pull_request:
    paths:
      - "client/**"
      - "backend/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.ts"
      - "vite.config.*"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright critical flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      MADA_DATABASE_MODE: memory
      MADA_SEED_DEMO_DATA: "true"
      MADA_JWT_SIGNING_KEY: ci-only-not-a-production-secret-32bytes-minimum
      ASPNETCORE_URLS: http://127.0.0.1:5180
      VITE_API_URL: http://127.0.0.1:5180/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore backend dependencies
        run: dotnet restore backend/MadaAcademy.Api/MadaAcademy.Api.csproj

      - name: Run Playwright E2E suite
        run: pnpm e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
