name: Frontend Checks

on:
  pull_request:
    paths:
      - "client/**"
      - "apps/landing/**"
      - "packages/mada-tokens/**"
      - "client-angular/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
      - "tsconfig.json"
      - "index.html"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React, Landing, and Angular checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: React typecheck
        run: pnpm check

      - name: React unit tests
        run: pnpm test

      - name: React production build
        run: pnpm build

      - name: Landing typecheck
        run: pnpm check:landing

      - name: Landing production build
        run: pnpm build:landing

      - name: Install Angular dependencies
        run: pnpm --dir client-angular install --frozen-lockfile --ignore-workspace

      - name: Angular unit tests
        run: pnpm --dir client-angular test

      - name: Angular production build
        run: pnpm --dir client-angular build
