name: Release Gate Script Validation

on:
  pull_request:
    paths:
      - "scripts/staging-smoke.sh"
      - "scripts/private-storage-smoke.sh"
      - "scripts/backup-restore-verify.sh"
      - ".github/workflows/release-script-validation.yml"
  push:
    branches: [dev]
    paths:
      - "scripts/staging-smoke.sh"
      - "scripts/private-storage-smoke.sh"
      - "scripts/backup-restore-verify.sh"
      - ".github/workflows/release-script-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release gate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell syntax and executable bits
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/staging-smoke.sh scripts/private-storage-smoke.sh scripts/backup-restore-verify.sh; do
            test -x "$script"
            bash -n "$script"
          done
      - name: Check repository whitespace
        run: git diff --check
