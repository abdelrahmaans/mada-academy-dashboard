version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mada_academy_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - MADA_RATE_LIMIT_MODE=single-instance
      - MADA_RATE_LIMIT_EXPECTED_INSTANCES=1
      - MADA_PRIVATE_STORAGE_MODE=supabase
      - SUPABASE_STORAGE_BUCKET=private-evidence
      - DATABASE_URL=${DATABASE_URL}
      - MADA_JWT_SIGNING_KEY=${MADA_JWT_SIGNING_KEY}
      - MADA_CORS_ORIGINS=${MADA_CORS_ORIGINS:-http://localhost:5173,http://localhost:4200}
      - MADA_FRONTEND_URL=${MADA_FRONTEND_URL:-http://localhost:5173}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
