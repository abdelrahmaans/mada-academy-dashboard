<button class="mobile-toggle" type="button" (click)="toggleMobile()" aria-label="فتح القائمة">☰</button>
<div class="sidebar-backdrop" [class.visible]="mobileOpen()" (click)="closeMobile()"></div>
<aside class="sidebar" [class.mobile-open]="mobileOpen()">
  <div class="brand-block">
    <div class="brand-mark">M</div>
    <div><strong>Mada</strong><span>ACADEMY OS</span></div>
    <button class="close-button" type="button" (click)="closeMobile()" aria-label="إغلاق القائمة">×</button>
  </div>

  <div class="role-preview">
    <label for="role-select">Role Preview</label>
    <select id="role-select" [value]="role()" (change)="selectRole($event)">
      @for (item of roles; track item.code) {
        <option [value]="item.code">{{ item.code }} · {{ item.label }}</option>
      }
    </select>
    <p>العرض يتغير حسب الـRole Registry. الحماية الحقيقية ستكون من ASP.NET Core.</p>
  </div>

  <nav class="nav-list" aria-label="التنقل الرئيسي">
    <p class="nav-label">مساحة العمل</p>
    @for (item of navigation; track item.path) {
      <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }" (click)="closeMobile()">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-copy"><strong>{{ item.label }}</strong><small>{{ item.purpose }}</small></span>
      </a>
    }
  </nav>

  <div class="scope-card">
    <span class="scope-kicker">CURRENT SCOPE</span>
    <strong>{{ currentRole.scopeLevel }}</strong>
    <span>{{ currentRole.defaultScopeLabel }}</span>
  </div>
</aside>
