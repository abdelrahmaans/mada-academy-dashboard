<header class="mada-page-header">
  <div class="mada-page-header__copy">
    @if (eyebrow()) {
      <div class="mada-page-header__eyebrow">{{ eyebrow() }}</div>
    }
    <h1>{{ title() }}</h1>
    @if (description()) {
      <p>{{ description() }}</p>
    }
  </div>
  <div class="mada-page-header__actions"><ng-content select="[madaPageActions]" /></div>
</header>
