<main class="foundation" dir="rtl">
  <section class="foundation__card" aria-labelledby="foundation-title">
    <p class="foundation__eyebrow">Mada Academy · Angular</p>
    <h1 id="foundation-title">واجهة Angular — مرحلة التأسيس</h1>
    <p class="foundation__intro">
      هذا تطبيق مستقل قيد الإعداد. لا يعرض بيانات تشغيلية ولا يتصل حاليًا بالـAPI؛ ستظل واجهة React
      هي المرجع إلى أن تكتمل مراجعة التكافؤ والقبول.
    </p>

    <ul class="foundation__list" aria-label="مبادئ الواجهة">
      @for (principle of foundations(); track principle) {
        <li>{{ principle }}</li>
      }
    </ul>

    <router-outlet />
  </section>
</main>
